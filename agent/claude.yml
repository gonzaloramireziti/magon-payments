# Workflow de Claude Code para los repos de los clientes.
# Copialo a .github/workflows/claude.yml en cada repo que se carga en el panel (Clientes → Repositorios).
# Ver AGENTE.md en el repo de magon-payments.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Solo cuando alguien menciona a @claude (el panel lo hace al crear el issue y al responder).
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Cada uno paga con su suscripción: se usa el secreto CLAUDE_TOKEN_<usuario de GitHub de quien lo dispara>
          # y, si no existe, el general CLAUDE_CODE_OAUTH_TOKEN. Los tokens se generan con `claude setup-token`.
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_TOKEN_{0}', github.actor)] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
